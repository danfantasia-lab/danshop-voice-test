<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>語音循環測試</title>
<style>
:root{--bg:#eef1ed;--paper:#fff;--ink:#1d2622;--muted:#5d6b64;--line:#d3dbd5;--accent:#1f5c4a;--accent-ink:#fff;--warn:#9a3b1c;--listen:#2d6fb3}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--paper:#1c2420;--ink:#e7ece9;--muted:#9aa8a1;--line:#2e3a34;--accent:#5fb39a;--accent-ink:#0f1513;--warn:#e58a68;--listen:#7fb2e8;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:17px;line-height:1.6;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:12px 0 0}
#state{font-size:30px;font-weight:700;text-align:center;padding:18px 8px;border-radius:16px;background:var(--paper);border:2px solid var(--line)}
#state.speaking{border-color:var(--accent);color:var(--accent)}
#state.listening{border-color:var(--listen);color:var(--listen)}
#heard{min-height:3.2em;font-size:20px;background:var(--paper);border-radius:12px;padding:10px 14px;border:1px solid var(--line)}
#heard .interim{color:var(--muted)}
button{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:14px;padding:16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.stop{background:none;color:var(--warn);border:2px solid var(--warn);font-size:16px;padding:10px}
.hint{font-size:14px;color:var(--muted)}
#log{flex:1;min-height:120px;overflow-y:auto;font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;white-space:pre-wrap;word-break:break-all}
.row{display:flex;gap:8px}.row>*{flex:1}
.engine{display:flex;flex-direction:column;gap:6px;font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.engine label{display:flex;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<h1>語音循環測試（不接 Claude）</h1>
<div class="hint">按開始後全程用講的：聽完題目就回答，講完說「<b>好了</b>」才送出。她講話時你可以直接插嘴。說「<b>今天先到這</b>」結束。這頁只測聲音循環，她會把聽到的內容唸回給你。</div>
<div id="state">還沒開始</div>
<div id="heard"></div>
<div class="engine"><b>聲音來源</b>
  <label><input type="radio" name="eng" value="ios" checked> A：iPhone 內建「美佳」</label>
</div>
<div class="engine"><b>插嘴模式</b>
  <label><input type="radio" name="barge" value="on" checked> 開：她講話時麥克風也開著，你一出聲她就停</label>
  <label><input type="radio" name="barge" value="off"> 關：她講完才開麥克風（比較穩，但不能插嘴）</label>
</div>
<audio id="player" referrerpolicy="no-referrer" playsinline></audio>
<div class="row"><button id="go">開始</button><button id="stop" class="stop" hidden>停止</button></div>
<div class="hint">測完請把下面的紀錄截圖給 Claude。</div>
<div id="log"></div>

<script>
const QUESTIONS = [
  '老闆你好，你們的信功大麥豬跟究好豬差在哪？',
  '那我平常煎梅花肉片，你會建議哪一種？',
  '這樣喔，那五花拿來滷，要買多少給四個人吃？',
  '最後一題，你們的香腸冷凍可以放多久？'
];
const $ = id => document.getElementById(id);
const logEl = $('log'), stateEl = $('state'), heardEl = $('heard');
const t0 = Date.now();
function log(s){ const t=((Date.now()-t0)/1000).toFixed(1); logEl.textContent += `[${t}] ${s}\n`; logEl.scrollTop = logEl.scrollHeight; }
function setState(cls, text){ stateEl.className = cls; stateEl.textContent = text; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
log('UA: ' + navigator.userAgent);
log('SpeechRecognition: ' + (SR ? '有' : '沒有'));
log('speechSynthesis: ' + ('speechSynthesis' in window ? '有' : '沒有'));

let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  const tw = vs.filter(v => /zh[-_]TW/i.test(v.lang));
  voice = tw.find(v => /mei.?jia|美佳/i.test(v.name)) || tw[0] || null;
  log('台灣語音：' + (tw.map(v=>v.name).join('、') || '沒有') + '　使用：' + (voice ? voice.name : '系統預設'));
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let active = false, rec = null, speaking = false, spokenText = '';
let finalBuf = '', interim = '', qIndex = 0, wakeLock = null;

function norm(s){ return (s||'').replace(/[\s，。、！？,.!?～~]/g,''); }
// 判斷聽到的是不是她自己的聲音（回音）：聽到的字八成以上都出現在她正在唸的句子裡
function isEcho(text){
  const a = norm(text); if(!a) return true;
  const b = norm(spokenText); if(!b) return false;
  let hit = 0; for(const ch of a) if(b.includes(ch)) hit++;
  return hit / a.length >= 0.8;
}

function render(){
  heardEl.innerHTML = '';
  const f = document.createElement('span'); f.textContent = finalBuf;
  const i = document.createElement('span'); i.className='interim'; i.textContent = interim;
  heardEl.append(f, i);
}

const player = document.getElementById('player');
function engine(){ return document.querySelector('input[name=eng]:checked').value; }
// Google 翻譯朗讀一次最多約 200 字，照標點切段依序播放
function chunks(text){
  const parts = text.match(/[^，。！？、,.!?]+[，。！？、,.!?]?/g) || [text];
  const out = []; let cur = '';
  for(const p of parts){ if((cur + p).length > 180){ if(cur) out.push(cur); cur = p; } else cur += p; }
  if(cur) out.push(cur); return out;
}
let gToken = 0;
function speakGoogle(text, then){
  const token = ++gToken; const list = chunks(text); let i = 0;
  const done = () => { if(token !== gToken) return; log('唸完'); speaking = false; spokenText = ''; if(active){ setState('listening','換你講，講完說「好了」'); then && then(); } };
  const next = () => {
    if(token !== gToken) return;
    if(i >= list.length) return done();
    const q = encodeURIComponent(list[i++]);
    player.src = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-TW&client=tw-ob&ttsspeed=1&q=' + q;
    player.onended = next;
    player.onerror = () => { log('Google 朗讀失敗（可能被擋）'); done(); };
    player.play().catch(e => { log('播放被擋：' + e.message); done(); });
  };
  next();
}
function stopSpeaking(){ gToken++; try{ player.pause(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }

function speak(text, then){
  spokenText = text; speaking = true;
  if(engine() === 'google'){ setState('speaking', '她在講話（可插嘴）'); log('開始唸（Google）：' + text); speakGoogle(text, then); return; }
  const myId = ++speakId;
  if(!bargeOn()){ pausedForTTS = true; try{ rec && rec.abort(); }catch(e){} }
  setState('speaking', bargeOn() ? '她在講話（可插嘴）' : '她在講話');
  const u = new SpeechSynthesisUtterance(text);
  if(voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = 'zh-TW';
  u.rate = 1;
  let ended = false;
  const finish = (why) => {
    if(ended || myId !== speakId) return; ended = true; clearInterval(dog);
    log('唸完（' + why + '）'); speaking = false; spokenText = '';
    if(pausedForTTS){ pausedForTTS = false; if(active) startRec(); }
    if(active){ setState('listening','換你講，講完說「好了」'); then && then(); }
  };
  u.onend = () => finish('onend');
  u.onerror = e => finish('錯誤 ' + e.error);
  const t0s = Date.now();
  // iPhone 開著麥克風時，朗讀結束常常收不到 onend，用輪詢補
  const dog = setInterval(() => { if(Date.now() - t0s > 1200 && !speechSynthesis.speaking && !speechSynthesis.pending) finish('輪詢'); }, 400);
  log('開始唸：' + text);
  speechSynthesis.speak(u);
}

let speakId = 0, pausedForTTS = false;
function bargeOn(){ return document.querySelector('input[name=barge]:checked').value === 'on'; }
function bargeIn(){
  log('偵測到插嘴，停止朗讀');
  speakId++; stopSpeaking(); speaking = false; spokenText = '';
  setState('listening','你在講，講完說「好了」');
}

function handleText(full){
  const n = norm(full);
  if(/今天先到這|今天就到這|今天先這樣/.test(n)){ finish(); return true; }
  const m = full.match(/^(.*?)[，,。\s]*好(了|啦|囉)[。！!]?\s*$/s);
  if(m){
    const answer = m[1].trim();
    finalBuf = ''; interim = ''; render();
    try{ rec.abort(); }catch(e){}  // 清掉這一段的辨識結果，避免同一句被送兩次
    log('送出：' + answer);
    // 測試頁：唸回聽到的內容，再問下一題
    qIndex++;
    const next = QUESTIONS[qIndex] || '題目問完了，你可以說今天先到這。';
    speak('你剛剛說：' + (answer || '沒聽到內容') + '。' + next);
    return true;
  }
  return false;
}

let lastInterimLog = 0;
function startRec(){
  if(!SR){ setState('', '這個瀏覽器不支援語音辨識'); return; }
  rec = new SR();
  rec.lang = 'zh-TW'; rec.continuous = true; rec.interimResults = true;
  rec.onstart = () => log('辨識開始');
  rec.onerror = e => log('辨識錯誤：' + e.error);
  rec.onend = () => { log('辨識結束'); if(active && !pausedForTTS) setTimeout(()=>{ try{ startRec(); }catch(e){ log('重啟失敗：'+e.message); } }, 250); };
  rec.onresult = e => {
    let fin = '', tmp = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) fin += r[0].transcript; else tmp += r[0].transcript;
    }
    const piece = fin || tmp;
    if(fin) log('聽到：' + fin + (speaking ? '（她還在講）' : ''));
    else if(Date.now() - lastInterimLog > 1500){ lastInterimLog = Date.now(); log('聽到中：' + tmp + (speaking ? '（她還在講）' : '')); }
    if(speaking){
      if(isEcho(piece)) { log('判定是回音，略過'); return; }
      if(norm(piece).length >= 2) bargeIn(); else return;
    }
    if(fin){ finalBuf += fin; interim = ''; } else interim = tmp;
    render();
    if(handleText(finalBuf + interim)) return;
  };
  try{ rec.start(); }catch(e){ log('start 失敗：' + e.message); }
}

async function finish(){
  log('收到「今天先到這」');
  finalBuf=''; interim=''; render();
  speak('好，今天就先到這，辛苦了。', stopAll);
}
function stopAll(){
  active = false;
  try{ rec && rec.abort(); }catch(e){}
  stopSpeaking();
  try{ wakeLock && wakeLock.release(); }catch(e){}
  setState('', '已停止'); $('go').hidden = false; $('stop').hidden = true;
  log('全部停止');
}

$('go').onclick = async () => {
  active = true; qIndex = 0; $('go').hidden = true; $('stop').hidden = false;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
  // iPhone 要在點擊當下先播一次，之後同一個播放器才能自動播放
  try{ player.src = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tAwAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYYoRBqpAAAAAAAAAAAAAAAAAAAA'; player.play().catch(()=>{}); }catch(e){}
  log('聲音來源：' + (engine()==='google' ? 'Google 翻譯' : 'iPhone 內建'));
  try{ wakeLock = await navigator.wakeLock.request('screen'); log('螢幕保持亮著：成功'); }catch(e){ log('螢幕保持亮著：失敗 ' + (e.message||'')); }
  startRec();
  speak(QUESTIONS[0]);
};
$('stop').onclick = stopAll;
document.addEventListener('visibilitychange', () => log('頁面' + (document.hidden ? '切到背景' : '回到前景')));
</script>
</body>
</html>
